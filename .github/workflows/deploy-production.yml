name: Deploy production

on:
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Exact merged main SHA selected by Auto merge
        required: false
        type: string
      source_pr:
        description: Source pull request number, when dispatched by Auto merge
        required: false
        type: string
  workflow_run:
    workflows: [Verify]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' ||
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') &&
      vars.VERCEL_ORG_ID != '' && vars.VERCEL_PROJECT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout verified revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.verified_sha || github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Confirm dispatched SHA belongs to main
        if: github.event_name == 'workflow_dispatch' && inputs.verified_sha != ''
        env:
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"
          git merge-base --is-ancestor "$VERIFIED_SHA" origin/main

      - name: Verify dispatched revision
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm ci
          npm run verify

      - name: Record delivery source
        if: github.event_name == 'workflow_dispatch' && inputs.source_pr != ''
        env:
          SOURCE_PR: ${{ inputs.source_pr }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          echo "Automatic delivery from PR #$SOURCE_PR at $VERIFIED_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Pull Vercel production configuration
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TEAM_TOKEN }}
        run: >-
          npx --yes vercel@60.1.3 pull --yes --environment=production
          --scope=domingo-dacha --token="$VERCEL_TOKEN"

      - name: Build production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TEAM_TOKEN }}
        run: >-
          npx --yes vercel@60.1.3 build --prod
          --scope=domingo-dacha --token="$VERCEL_TOKEN"

      - name: Apply test database migrations
        run: >-
          node --env-file=.vercel/.env.production.local
          --import tsx scripts/migrate.ts

      - name: Publish production artifact
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TEAM_TOKEN }}
        run: |
          deployment_url="$(npx --yes vercel@60.1.3 deploy --prebuilt --prod --scope=domingo-dacha --token="$VERCEL_TOKEN")"
          echo "Deployment: $deployment_url" >> "$GITHUB_STEP_SUMMARY"
